<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="contourGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Outer Shield / Location Base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#grad1)" shadow="0 4 12 rgba(37,99,235,0.3)" />
  
  <!-- Topographic Elevation Contours -->
  <path d="M 12 44 Q 24 32 36 38 T 52 28" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 12 50 Q 26 38 40 44 T 52 38" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 16 34 Q 28 22 42 26 T 50 18" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Center Hazard Beacon / Geospatial Marker -->
  <circle cx="32" cy="24" r="8" fill="#ffffff" />
  <circle cx="32" cy="24" r="4" fill="#ef4444" />
  
  <!-- Pulse Ring -->
  <circle cx="32" cy="24" r="14" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 2" />
  
  <!-- Small Risk Alert Indicator Dot -->
  <circle cx="48" cy="16" r="3.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1" />
</svg>
