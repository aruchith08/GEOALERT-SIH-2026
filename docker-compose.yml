version: '3.8'

services:
  # Backend Inference API & Risk Engine
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sih2026-landslide-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,*
    volumes:
      - ./models:/app/models:ro
      - ./reports:/app/reports:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Frontend Web GIS Dashboard
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sih2026-landslide-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: sih2026-network
